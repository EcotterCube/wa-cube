<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Match WorkAdventure's dark theme: a color-scheme mismatch with the
         embedding page would make the browser paint an opaque white background
         behind this otherwise transparent iframe. -->
    <meta name="color-scheme" content="dark" />
    <title>NPC dialog</title>
    <script>
        // Load iframe_api.js from the WorkAdventure server embedding this page,
        // so the page works on play.workadventu.re, play.staging.workadventu.re
        // and self-hosted instances alike.
        let playOrigin = "https://play.workadventu.re";
        try {
            if (document.referrer) {
                playOrigin = new URL(document.referrer).origin;
            }
        } catch (e) {
            console.error("Could not derive the WorkAdventure origin from the referrer", e);
        }
        document.write('<script src="' + playOrigin + '/iframe_api.js"><\/script>');
    </script>
</head>
<body>
    <!--IFRAME_SCRIPT-->
</body>
</html>
